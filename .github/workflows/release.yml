name: release

# Run by hand, it builds the binaries, disk images and installer to download from the run, and publishes nothing
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
      - name: the tag is the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version package.json)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - run: bun test
      # The index's pages for ender web, built from its newest code against this ender: ender-index finds ender at
      # ../ender-launcher, so this release is checked out again beside it
      - uses: actions/checkout@v4
        with:
          path: site/ender-launcher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-index
          path: site/ender-index
          persist-credentials: false
      - name: the index's pages
        run: |
          (cd site/ender-index && bun install --frozen-lockfile && bun run build:site)
          bun scripts/embedSite.js site/ender-index/client/build
          echo "INDEX_COMMIT=$(git -C site/ender-index rev-parse HEAD)" >> "$GITHUB_ENV"
      # Bun compiles for every platform from this one; each binary carries Bun itself, so needs nothing installed
      - name: build
        run: |
          mkdir dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            suffix=''; [ "${target%%-*}" = windows ] && suffix='.exe'
            bun build --compile --minify --target="bun-$target" index.js --outfile "dist/ender-$target$suffix"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
      - run: echo "$INDEX_COMMIT" > index-commit
      - uses: actions/upload-artifact@v4
        with:
          name: index-commit
          path: index-commit

  # A disk image per chip: Ender.app around that chip's binary, signed ad hoc, which a first open asks to allow in
  # Privacy & Security since no Apple developer id signs it
  macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      - name: disk images
        run: |
          mkdir out
          for chip in arm64 x64; do
            bun scripts/bundle.js "dist/ender-darwin-$chip" "stage-$chip/Ender.app"
            codesign --force --deep --sign - "stage-$chip/Ender.app"
            ln -s /Applications "stage-$chip/Applications"
            hdiutil create -volname Ender -srcfolder "stage-$chip" -ov -format UDZO "out/Ender-mac-$chip.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  # An installer for this user alone, which SmartScreen warns of since no certificate signs it
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      - name: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc "/DVersion=$version" "/DSource=$((Resolve-Path dist).Path)" installer\ender.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory out | Out-Null
          Move-Item dist\Ender-Setup.exe out\Ender-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  publish:
    needs: [build, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: gather
        run: |
          mkdir dist
          cp artifacts/binaries/* artifacts/macos/* artifacts/windows/* assets/ender.png assets/ender.icns assets/ender.ico dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "INDEX_COMMIT=$(cat artifacts/index-commit/index-commit)" >> "$GITHUB_ENV"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "ender $GITHUB_REF_NAME" --generate-notes \
            --notes "ender web serves the index's pages as of fatlard1993/ender-index@$INDEX_COMMIT."
      - name: homebrew
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo 'No TAP_TOKEN secret, so the Homebrew formula is left as it was'; exit 0; fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/fatlard1993/homebrew-tap.git" tap
          mkdir -p tap/Formula
          bun scripts/formula.js "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > tap/Formula/ender.rb
          cd tap
          git config user.name 'ender-launcher'
          git config user.email 'ender-launcher@users.noreply.github.com'
          git add Formula/ender.rb
          git commit -qm "ender ${GITHUB_REF_NAME#v}"
          git push -q
